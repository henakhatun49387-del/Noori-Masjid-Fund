<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नूरी मस्जिद - एडवांस एडमिन पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: sans-serif; }</style>
</head>
<body class="bg-slate-100 pb-12">

    <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
        <h1 class="font-bold text-base"><i class="fa-solid fa-mosque mr-2 text-amber-300"></i>नूरी मस्जिद फंड (एडमिन मोड)</h1>
        <button onclick="openAddMemberModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-1.5 rounded-xl text-xs font-bold shadow">
            + नया मेंबर जोड़ें
        </button>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <!-- सदस्यों की सूची -->
        <div id="memberList" class="space-y-3"></div>
    </main>

    <!-- मेंबर एडिट और डिटेल मॉडल -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <div>
                    <h3 id="modalTitle" class="font-bold text-lg text-slate-800">डिटेल एडिट करें</h3>
                    <p class="text-xs text-slate-500">आईडी: <span id="modalId"></span></p>
                </div>
                <button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- मोबाइल नंबर और तारीख -->
            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-xs font-semibold text-slate-600">मोबाइल नंबर (WhatsApp के लिए)</label>
                    <input type="text" id="editPhone" placeholder="मोबाइल नंबर दर्ज करें" class="w-full bg-slate-50 border p-2.5 rounded-xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">अंतिम भुगतान की तारीख (Payment Date)</label>
                    <input type="date" id="editDate" class="w-full bg-slate-50 border p-2.5 rounded-xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">भुगतान का तरीका (Payment Mode)</label>
                    <select id="editMode" class="w-full bg-slate-50 border p-2.5 rounded-xl text-sm mt-1">
                        <option value="Cash (नकद)">Cash (नकद)</option>
                        <option value="Online (ऑनलाइन UPI)">Online (ऑनलाइन UPI)</option>
                    </select>
                </div>
            </div>

            <!-- महीने का हिसाब -->
            <div class="mb-4">
                <label class="text-xs font-semibold text-slate-600 mb-2 block">महीनेवार हिसाब (क्लिक करके Paid/Unpaid करें)</label>
                <div id="monthsGrid" class="grid grid-cols-3 gap-2"></div>
            </div>

            <button onclick="saveMemberDetails()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow mb-2">
                बदलाव सेव करें (Save)
            </button>
            <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium text-xs">
                रद्द करें
            </button>
        </div>
    </div>

    <!-- नया मेंबर जोड़ने का मॉडल -->
    <div id="addModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800 mb-3">नया सदस्य जोड़ें</h3>
            <input type="text" id="newEnName" placeholder="नाम (English में)" class="w-full border p-2.5 rounded-xl text-sm mb-3">
            <input type="text" id="newHiName" placeholder="हिंदी नाम (जैसे: एम डी सलीम)" class="w-full border p-2.5 rounded-xl text-sm mb-3">
            <input type="text" id="newPhone" placeholder="मोबाइल नंबर" class="w-full border p-2.5 rounded-xl text-sm mb-4">
            <button onclick="addNewMemberAction()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm mb-2">जोड़ें</button>
            <button onclick="closeAddMemberModal()" class="w-full bg-slate-200 py-2 rounded-xl text-xs">बंद करें</button>
        </div>
    </div>

    <script>
        const monthNames = ["जनवरी", "फरवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"];

        let members = JSON.parse(localStorage.getItem('nooriFullAdminData')) || [
            { id: 101, en: "MD Salim", hi: "एम डी सलीम", phone: "9876543210", date: "2026-01-10", mode: "Cash (नकद)", paid: [true, false, false, false, false, false, false, false, false, false, false, false] },
            { id: 102, en: "MD Haleem", hi: "एम डी हलीम", phone: "9876543211", date: "", mode: "Cash (नकद)", paid: [false, false, false, false, false, false, false, false, false, false, false, false] }
        ];

        function renderList() {
            let list = document.getElementById('memberList');
            list.innerHTML = members.map(m => {
                let paidCount = m.paid.filter(Boolean).length;
                let totalPaidAmt = paidCount * 500;
                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center cursor-pointer hover:border-emerald-500 transition" onclick="openEdit(${m.id})">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">#${m.id}</span>
                                <h4 class="font-bold text-slate-800 text-sm">${m.en} (${m.hi})</h4>
                            </div>
                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-phone text-[10px] mr-1"></i>${m.phone || 'नंबर नहीं है'} | मोड: ${m.mode || 'Cash'}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">₹${totalPaidAmt} जमा</span>
                            <p class="text-[10px] text-slate-400 mt-1">${paidCount}/12 महीने</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        let currentEditId = null;
        function openEdit(id) {
            currentEditId = id;
            let m = members.find(x => x.id === id);
            document.getElementById('modalId').innerText = m.id;
            document.getElementById('modalTitle').innerText = m.en + " (" + m.hi + ")";
            document.getElementById('editPhone').value = m.phone || "";
            document.getElementById('editDate').value = m.date || "";
            document.getElementById('editMode').value = m.mode || "Cash (नकद)";

            let grid = document.getElementById('monthsGrid');
            grid.innerHTML = monthNames.map((mon, idx) => `
                <button type="button" onclick="toggleMonth(${idx})" class="p-2 text-xs rounded-xl border font-medium transition ${m.paid[idx] ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-slate-50 text-slate-500 border-slate-200'}">
                    ${mon} ${m.paid[idx] ? '✓' : ''}
                </button>
            `).join('');

            document.getElementById('editModal').classList.remove('hidden');
        }

        function toggleMonth(idx) {
            let m = members.find(x => x.id === currentEditId);
            m.paid[idx] = !m.paid[idx];
            openEdit(currentEditId); // रिफ्रेश करने के लिए
        }

        function saveMemberDetails() {
            let m = members.find(x => x.id === currentEditId);
            m.phone = document.getElementById('editPhone').value;
            m.date = document.getElementById('editDate').value;
            m.mode = document.getElementById('editMode').value;
            
            localStorage.setItem('nooriFullAdminData', JSON.stringify(members));
            renderList();
            closeModal();
            alert("डेटा सफलतापूर्वक सेव हो गया है!");
        }

        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }
        function openAddMemberModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddMemberModal() { document.getElementById('addModal').classList.add('hidden'); }

        function addNewMemberAction() {
            let en = document.getElementById('newEnName').value.trim();
            let hi = document.getElementById('newHiName').value.trim();
            let phone = document.getElementById('newPhone').value.trim();
            if(!en) { alert("कृपया नाम दर्ज करें!"); return; }

            let newId = members.length > 0 ? Math.max(...members.map(x => x.id)) + 1 : 101;
            members.push({
                id: newId,
                en: en,
                hi: hi || en,
                phone: phone,
                date: "",
                mode: "Cash (नकद)",
                paid: [false, false, false, false, false, false, false, false, false, false, false, false]
            });

            localStorage.setItem('nooriFullAdminData', JSON.stringify(members));
            renderList();
            closeAddMemberModal();
            document.getElementById('newEnName').value = "";
            document.getElementById('newHiName').value = "";
            document.getElementById('newPhone').value = "";
            alert("नया मेंबर जुड़ गया है!");
        }

        renderList();
    </script>
</body>
</html>
