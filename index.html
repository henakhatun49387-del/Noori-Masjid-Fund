<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Village Portal - गाँव डिजिटल पोर्टल</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .card { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .phone-box { display: flex; gap: 8px; }
        .country-code { width: 75px; text-align: center; font-weight: bold; background: #eee; }
        input, button { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        button { background: #27ae60; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #219653; }
        .btn-primary { background: #2980b9; }
        .btn-primary:hover { background: #1f618d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #e8f4f8; color: #2c3e50; }
        #app-section { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏡 Digital Village Portal</h2>

    <!-- 1. PHONE & OTP LOGIN SECTION -->
    <div id="login-section" class="card">
        <h3 style="margin-top:0;">Mobile OTP Login</h3>
        <div class="form-group">
            <label>Mobile Number</label>
            <div class="phone-box">
                <input type="text" id="country-code" class="country-code" value="+91" readonly>
                <input type="tel" id="phone-number" placeholder="10-ank ka mobile number" maxlength="10">
            </div>
        </div>
        <!-- Invisible container for Firebase Auth (No ReCaptcha UI needed) -->
        <div id="recaptcha-container"></div>
        <button class="btn-primary" onclick="sendOTP()">OTP Bhejein</button>

        <div id="otp-verify-box" style="display:none; margin-top: 15px;">
            <div class="form-group">
                <label>6-digit OTP Daalein</label>
                <input type="text" id="otp-code" placeholder="OTP yahan likhein" maxlength="6">
            </div>
            <button onclick="verifyOTP()">Verify OTP & Login</button>
        </div>
    </div>

    <!-- 2. MAIN VILLAGE PORTAL SECTION -->
    <div id="app-section">
        <div class="card" style="background: #eef9ff;">
            <h3 style="margin-top:0;">Gaon Naya Record Jodein</h3>
            <div class="form-group">
                <label>Niwasi ka Naam (Resident Name)</label>
                <input type="text" id="res-name" placeholder="Pura naam likhein">
            </div>
            <div class="form-group">
                <label>Ward No. / Makan No.</label>
                <input type="text" id="res-ward" placeholder="Jaise: Ward No. 3">
            </div>
            <div class="form-group">
                <label>Vivaran / Kaam (Details)</label>
                <input type="text" id="res-details" placeholder="Jaise: Kisan / Vyapar / Job">
            </div>
            <button onclick="saveVillageData()">Data Save Karein</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">Gaon Ki Jankari List</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Naam</th>
                            <th>Ward</th>
                            <th>Vivaran</th>
                        </tr>
                    </thead>
                    <tbody id="village-table-body">
                        <tr><td colspan="3" style="text-align: center;">Load ho raha hai...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <button style="background: #c0392b;" onclick="logoutUser()">Logout</button>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhhT911tNs0t15w70Ic4rjO-kgRTaKu78",
      authDomain: "monthly-salary-2a1bd.firebaseapp.com",
      databaseURL: "https://monthly-salary-2a1bd-default-rtdb.firebaseio.com",
      projectId: "monthly-salary-2a1bd",
      storageBucket: "monthly-salary-2a1bd.firebasestorage.app",
      messagingSenderId: "766706380489",
      appId: "1:766706380489:web:0de4f388c2719c0bb3a718",
      measurementId: "G-YSDBJSW02X"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.auth = auth;
    window.db = db;
    window.RecaptchaVerifier = RecaptchaVerifier;
    window.signInWithPhoneNumber = signInWithPhoneNumber;
    window.signOut = signOut;
    window.ref = ref;
    window.push = push;
    window.set = set;
    window.onValue = onValue;

    // Invisible Recaptcha setup (koi robot box nahi dikhega)
    window.onload = function() {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible'
        });
    };

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            loadVillageData();
        } else {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }
    });
</script>

<script>
    window.sendOTP = function() {
        const countryCode = document.getElementById('country-code').value;
        const userPhone = document.getElementById('phone-number').value;

        if(!userPhone || userPhone.length < 10) {
            alert("Kripya sahi 10-ank ka mobile number daalein!");
            return;
        }

        const fullPhoneNumber = countryCode + userPhone;
        const appVerifier = window.recaptchaVerifier;

        window.signInWithPhoneNumber(window.auth, fullPhoneNumber, appVerifier)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                document.getElementById('otp-verify-box').style.display = 'block';
                alert("OTP bhej diya gaya hai!");
            }).catch((error) => {
                alert("OTP bhejne mein error: " + error.message);
            });
    }

    window.verifyOTP = function() {
        const code = document.getElementById('otp-code').value;
        if(!code || code.length < 6) {
            alert("Kripya pura 6-ank ka OTP daalein!");
            return;
        }

        window.confirmationResult.confirm(code).then((result) => {
            alert("Login safal raha!");
        }).catch((error) => {
            alert("Galat OTP! Kripya dobara koshish karein.");
        });
    }

    window.saveVillageData = function() {
        const name = document.getElementById('res-name').value;
        const ward = document.getElementById('res-ward').value;
        const details = document.getElementById('res-details').value;

        if(!name || !ward) {
            alert("Kripya naam aur ward number bharein!");
            return;
        }

        const dbRef = window.ref(window.db, 'gaon_records');
        const newRef = window.push(dbRef);
        window.set(newRef, {
            name: name,
            ward: ward,
            details: details,
            timestamp: Date.now()
        }).then(() => {
            alert("Gaon ka data safalpurvak save ho gaya!");
            document.getElementById('res-name').value = '';
            document.getElementById('res-ward').value = '';
            document.getElementById('res-details').value = '';
        }).catch((error) => {
            alert("Error: " + error.message);
        });
    }

    function loadVillageData() {
        const dbRef = window.ref(window.db, 'gaon_records');
        window.onValue(dbRef, (snapshot) => {
            const tbody = document.getElementById('village-table-body');
            tbody.innerHTML = '';
            const data = snapshot.val();
            if(data) {
                Object.values(data).forEach(record => {
                    const row = `<tr>
                        <td>${record.name}</td>
                        <td>${record.ward}</td>
                        <td>${record.details || '-'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Abhi koi data nahi hai.</td></tr>`;
            }
        });
    }

    window.logoutUser = function() {
        window.signOut(window.auth).then(() => {
            alert("Aap logout ho gaye hain.");
        });
    }
</script>

</body>
</html>
