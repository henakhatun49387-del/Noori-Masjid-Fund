<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>नूरी मस्जिद - प्रो एडमिन पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-md mx-auto">
        <h2 class="text-2xl font-bold text-center text-emerald-900 mb-6">नूरी मस्जिद एडमिन</h2>
        <div id="memberList" class="space-y-3"></div>
    </div>

    <div id="editModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl">
            <h3 id="modalName" class="font-bold text-lg mb-4 text-emerald-800"></h3>
            <input type="text" id="editPhone" placeholder="मोबाइल नंबर" class="w-full border p-2 rounded mb-2">
            <input type="date" id="editDate" class="w-full border p-2 rounded mb-2">
            <select id="editMode" class="w-full border p-2 rounded mb-4">
                <option value="Cash">Cash (नकद)</option>
                <option value="Online">Online (ऑनलाइन)</option>
            </select>
            <div id="monthsGrid" class="grid grid-cols-4 gap-2 mb-4"></div>
            <button onclick="saveData()" class="w-full bg-emerald-600 text-white py-2 rounded-xl font-bold">सेव और वॉट्सएप रसीद</button>
            <button onclick="document.getElementById('editModal').classList.add('hidden')" class="w-full mt-2 text-gray-500">बंद करें</button>
        </div>
    </div>

    <script>
        let members = JSON.parse(localStorage.getItem('nooriData')) || [
            { id: 1, name: "MD Salim", phone: "", date: "", mode: "Cash", paid: Array(12).fill(false) }
        ];
        let editingId = null;

        function render() {
            document.getElementById('memberList').innerHTML = members.map(m => `
                <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center" onclick="edit(${m.id})">
                    <div>
                        <p class="font-bold">${m.name}</p>
                        <p class="text-xs text-gray-500">Ph: ${m.phone || '—'}</p>
                    </div>
                    <span class="text-emerald-600 font-bold">₹${m.paid.filter(Boolean).length * 500}</span>
                </div>
            `).join('');
        }

        function edit(id) {
            editingId = id;
            let m = members.find(x => x.id === id);
            document.getElementById('modalName').innerText = m.name;
            document.getElementById('editPhone').value = m.phone;
            document.getElementById('editDate').value = m.date;
            document.getElementById('editMode').value = m.mode;
            let grid = document.getElementById('monthsGrid');
            grid.innerHTML = m.paid.map((p, i) => `<button onclick="toggleMonth(${i})" class="p-2 text-xs rounded ${p ? 'bg-green-500 text-white' : 'bg-red-200'}">M${i+1}</button>`).join('');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function toggleMonth(i) {
            let m = members.find(x => x.id === editingId);
            m.paid[i] = !m.paid[i];
            edit(editingId);
        }

        function saveData() {
            let m = members.find(x => x.id === editingId);
            m.phone = document.getElementById('editPhone').value;
            m.date = document.getElementById('editDate').value;
            m.mode = document.getElementById('editMode').value;
            localStorage.setItem('nooriData', JSON.stringify(members));
            
            // वॉट्सएप रसीद
            let msg = `नूरी मस्जिद रसीद: ${m.name}, कुल जमा: ₹${m.paid.filter(Boolean).length * 500}`;
            window.open(`https://wa.me/${m.phone}?text=${encodeURIComponent(msg)}`, '_blank');
            
            render();
            document.getElementById('editModal').classList.add('hidden');
        }
        render();
    </script>
</body>
</html>
