<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गाँव डिजिटल पोर्टल</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; color: #1e293b; padding: 0; margin: 0; }
        .header { background: linear-gradient(135deg, #4f46e5, #9333ea); color: white; padding: 20px; text-align: center; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
        .container { max-width: 400px; margin: auto; padding: 15px; margin-top: 10px; }
        .card { background: #ffffff; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; text-align: center; }
        input { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .hidden { display: none; }
        .item { background: #f1f5f9; padding: 10px; margin-top: 8px; border-radius: 6px; text-align: left; font-size: 14px; border-left: 4px solid #4f46e5; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏡 गाँव डिजिटल पोर्टल</h2>
        <p style="margin:5px 0 0; font-size:13px;">सुरक्षित OTP लॉगिन सिस्टम</p>
    </div>

    <div class="container">
        <!-- 1. फोन नंबर लॉगिन बॉक्स -->
        <div class="card" id="step-phone">
            <h3>मोबाइल नंबर दर्ज करें</h3>
            <input type="text" id="phone" value="+91" placeholder="+919876543210">
            <div id="recaptcha-container"></div>
            <button onclick="sendOTP()">OTP भेजें</button>
        </div>

        <!-- 2. OTP वेरीफाई बॉक्स -->
        <div class="card hidden" id="step-otp">
            <h3>OTP दर्ज करें</h3>
            <input type="text" id="otp" placeholder="6-अंक का कोड यहाँ लिखें">
            <button onclick="verifyOTP()">वेरीफाई करें</button>
        </div>

        <!-- 3. डैशबोर्ड और डेटा एंट्री बॉक्स -->
        <div class="card hidden" id="step-dashboard">
            <h3 style="color: #16a34a;">✅ लॉगिन सफल</h3>
            <p style="font-size: 13px; color: #64748b;">नया रिकॉर्ड दर्ज करें:</p>
            <input type="text" id="c-name" placeholder="नागरिक का नाम">
            <input type="text" id="c-work" placeholder="काम / विवरण (उदा: किसान)">
            <button onclick="saveData()" style="background: #16a34a;">डेटा सेव करें</button>

            <hr style="margin: 20px 0; border:0; border-top:1px solid #e2e8f0;">
            <h3 style="text-align:left; font-size:15px;">दर्ึง रिकॉर्ड्स:</h3>
            <div id="data-list" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

<script>
    // ⚙️ यहाँ अपनी Firebase कंसोल वाली असली डिटेल्स डालें
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    window.onload = function() {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible'
        });
    };

    function sendOTP() {
        const phone = document.getElementById('phone').value;
        auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
            .then((result) => {
                window.confResult = result;
                alert("OTP भेज दिया गया है!");
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
            }).catch((error) => {
                alert("एरर: " + error.message);
            });
    }

    function verifyOTP() {
        const code = document.getElementById('otp').value;
        window.confResult.confirm(code).then(() => {
            alert("लॉगिन सफल रहा!");
            document.getElementById('step-otp').classList.add('hidden');
            document.getElementById('step-dashboard').classList.remove('hidden');
            loadData();
        }).catch(() => {
            alert("गलत OTP, दोबारा कोशिश करें।");
        });
    }

    function saveData() {
        const name = document.getElementById('c-name').value;
        const work = document.getElementById('c-work').value;
        if(!name) { alert("नाम लिखना जरूरी है!"); return; }

        db.ref('records/').push({
            name: name,
            work: work,
            date: new Date().toLocaleDateString('hi-IN')
        }).then(() => {
            alert("डेटा सफलतापूर्वक सेव हो गया!");
            document.getElementById('c-name').value = '';
            document.getElementById('c-work').value = '';
        });
    }

    function loadData() {
        db.ref('records/').on('value', (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('data-list');
            list.innerHTML = '';
            if(data) {
                Object.values(data).reverse().forEach(item => {
                    list.innerHTML += `<div class="item"><b>नाम:</b> ${item.name}<br><b>विवरण:</b> ${item.work || 'नियम'} <span style="float:right; font-size:11px; color:#64748b;">${item.date}</span></div>`;
                });
            } else {
                list.innerHTML = '<p style="font-size:13px; color:#64748b;">कोई डेटा नहीं है।</p>';
            }
        });
    }
</script>

</body>
</html>
