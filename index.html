
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noori Masjid Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gpay-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { border-bottom: 2px solid #10b981; color: #10b981; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <!-- Home Dashboard -->
    <div id="homeView" class="p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">नमस्ते, एडमिन!</h1>
            <button class="bg-emerald-600 text-white p-2 rounded-full shadow-lg"><i class="fa-solid fa-plus"></i></button>
        </div>
        
        <div class="gpay-bg text-white p-6 rounded-3xl shadow-xl mb-6">
            <p class="text-slate-400 text-sm">कुल जमा राशि</p>
            <h2 class="text-4xl font-bold my-2">₹48,000</h2>
            <div class="flex justify-between mt-4 text-xs text-slate-300">
                <span>इस महीने: ₹4,500</span>
                <span>बाकी: ₹1,20,000</span>
            </div>
        </div>

        <div class="flex gap-4 mb-6">
            <button onclick="showView('searchView')" class="flex-1 bg-white p-4 rounded-2xl shadow border flex flex-col items-center"><i class="fa-solid fa-magnifying-glass text-emerald-600 mb-2"></i> सर्च</button>
            <button onclick="showView('listView')" class="flex-1 bg-white p-4 rounded-2xl shadow border flex flex-col items-center"><i class="fa-solid fa-list text-emerald-600 mb-2"></i> सूची</button>
        </div>
    </div>

    <!-- Search View -->
    <div id="searchView" class="hidden p-4">
        <button onclick="showView('homeView')" class="mb-4 text-slate-500"><i class="fa-solid fa-arrow-left"></i> वापस</button>
        <input type="text" placeholder="नाम या आईडी सर्च करें..." class="w-full p-4 rounded-2xl border shadow-sm mb-4">
    </div>

    <!-- List View -->
    <div id="listView" class="hidden p-4">
        <button onclick="showView('homeView')" class="mb-4 text-slate-500"><i class="fa-solid fa-arrow-left"></i> वापस</button>
        <div id="membersList" class="space-y-3"></div>
    </div>

    <!-- Details View (Modal Style) -->
    <div id="detailsView" class="hidden fixed inset-0 bg-white z-50 p-6 overflow-y-auto">
        <button onclick="closeDetails()" class="mb-6"><i class="fa-solid fa-xmark text-2xl"></i></button>
        <h2 id="memberName" class="text-2xl font-bold mb-2"></h2>
        <div class="bg-slate-100 p-4 rounded-2xl mb-6">
            <p class="text-sm text-slate-500">कुल जमा: <span id="memberTotal" class="font-bold text-emerald-600"></span></p>
        </div>
        <div id="monthsGrid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <script>
        const members = Array.from({length: 32}, (_, i) => ({id: 101+i, name: "Member "+(101+i), paid: Array(12).fill(false)}));

        function showView(id) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('searchView').classList.add('hidden');
            document.getElementById('listView').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
            if(id === 'listView') renderList();
        }

        function renderList() {
            document.getElementById('membersList').innerHTML = members.map(m => `
                <div onclick="openDetails(${m.id})" class="bg-white p-4 rounded-2xl border flex justify-between items-center">
                    <span class="font-bold">${m.name}</span>
                    <span class="text-emerald-600 font-bold">₹${m.paid.filter(Boolean).length * 500}</span>
                </div>
            `).join('');
        }

        function openDetails(id) {
            let m = members.find(x => x.id === id);
            document.getElementById('memberName').innerText = m.name;
            document.getElementById('detailsView').classList.remove('hidden');
        }

        function closeDetails() { document.getElementById('detailsView').classList.add('hidden'); }
    </script>
</body>
</html>
