<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नूरी मस्जिद - एडमिन पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #splash { position: fixed; inset: 0; background: #064e3b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s ease; color: white; }
    </style>
</head>
<body class="bg-slate-100 pb-16">

    <!-- Splash Screen -->
    <div id="splash">
        <i class="fa-solid fa-mosque text-5xl text-amber-300 mb-3 animate-bounce"></i>
        <h1 class="text-2xl font-bold">नूरी मस्जिद फंड</h1>
        <p class="text-xs text-emerald-200 mt-1">एडमिन पोर्टल लोड हो रहा है...</p>
    </div>

    <!-- Header & Search -->
    <header class="bg-emerald-800 text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-base"><i class="fa-solid fa-mosque mr-2 text-amber-300"></i>नूरी मस्जिद (एडमिन)</h2>
            <span class="text-xs bg-emerald-700 px-2.5 py-1 rounded-full text-amber-200 font-semibold">32 सदस्य</span>
        </div>
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="नाम या ID से खोजें..." oninput="filterMembers()" class="w-full bg-white text-slate-800 text-sm pl-9 pr-4 py-2.5 rounded-xl outline-none shadow-inner">
        </div>
    </header>

    <!-- Member List -->
    <main class="p-4 max-w-lg mx-auto">
        <div id="memberList" class="space-y-3"></div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <div>
                    <h3 id="modalName" class="font-bold text-base text-slate-800"></h3>
                    <p class="text-xs text-slate-500">आईडी: <span id="modalId"></span></p>
                </div>
                <button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-3 mb-4">
                <div>
                    <label class="text-xs font-semibold text-slate-600">मोबाइल नंबर</label>
                    <input type="text" id="editPhone" placeholder="मोबाइल नंबर" class="w-full bg-slate-50 border p-2.5 rounded-xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">पेमेंट तारीख</label>
                    <input type="date" id="editDate" class="w-full bg-slate-50 border p-2.5 rounded-xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600">पेमेंट मोड</label>
                    <select id="editMode" class="w-full bg-slate-50 border p-2.5 rounded-xl text-sm mt-1">
                        <option value="Cash (नकद)">Cash (नकद)</option>
                        <option value="Online (ऑनलाइन)">Online (ऑनलाइन)</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="text-xs font-semibold text-slate-600 mb-2 block">12 महीने का हिसाब (क्लिक करके बदलें)</label>
                <div id="monthsGrid" class="grid grid-cols-3 gap-2"></div>
            </div>

            <button onclick="saveChanges()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow mb-2">
                बदलाव सेव करें
            </button>
            <button onclick="closeModal()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium text-xs">
                रद्द करें
            </button>
        </div>
    </div>

    <!-- Click Sound Audio -->
    <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script>
        // 3 सेकंड का Splash Screen हटाना
        setTimeout(() => {
            let splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 500);
        }, 2000);

        const monthNames = ["जनवरी", "फरवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"];

        // पूरे 32 सदस्यों की फिक्स लिस्ट (पुराना जंक डेटा हटाने के लिए वर्शन v4 इस्तेमाल किया है)
        const defaultMembers = [
            { id: 101, name: "MD Salim (एम डी सलीम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 102, name: "MD Haleem (एम डी हलीम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 103, name: "MD Mustaqim (एम डी मुर्तकीम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 104, name: "MD Akbar (एम डी अकबर)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 105, name: "MD Hakim (एम डी हकीम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 106, name: "Md Kalam (एम डी कलाम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 107, name: "MD Idris (एम डी इद्रीस)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 108, name: "MD Salam (एम डी सलाम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 109, name: "MD Javed (एम डी जावेद)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 110, name: "Md Hanif (एम डी हनीफ)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 111, name: "MD Rashid (एम डी रशीद)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 112, name: "MD Gafoor (एम डी गफ्फार)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 113, name: "MD Anwar (एम डी अनवर)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 114, name: "MD Shamim (एम डी शमीम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 115, name: "MD Zahir (एम डी जाहिर)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 116, name: "MD Farooq (एम डी फारूक)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 117, name: "MD Nazir (एम डी नजीर)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 118, name: "MD Qasim (एम डी कासिम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 119, name: "MD Habib (एम डी हबीब)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 120, name: "MD Latif (एम डी लतीफ)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 121, name: "MD Sohail (एम डी सोहेल)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 122, name: "MD Arman (एम डी अरमान)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 123, name: "MD Danish (एम डी दानिश)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 124, name: "MD Aslam (एम डी असलम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 125, name: "MD Irfan (एम डी इरफान)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 126, name: "MD Imran (एम डी इमरान)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 127, name: "MD Shahbaz (एम डी शाहबाज)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 128, name: "MD Altaf (एम डी अल्ताफ)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 129, name: "MD Shahnawaz (एम डी शाहनवाज)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 130, name: "MD Faiyaz (एम डी फैयाज)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 131, name: "MD Tanveer (एम डी तनवीर)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) },
            { id: 132, name: "MD Wasim (एम डी वसीम)", phone: "", date: "", mode: "Cash (नकद)", paid: Array(12).fill(false) }
        ];

        let members = JSON.parse(localStorage.getItem('nooriFund_v4')) || defaultMembers;

        function renderList(data) {
            let list = document.getElementById('memberList');
            list.innerHTML = data.map(m => {
                let paidCount = m.paid.filter(Boolean).length;
                let totalAmt = paidCount * 500;
                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center cursor-pointer hover:border-emerald-500 transition" onclick="openEdit(${m.id})">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">#${m.id}</span>
                                <h4 class="font-bold text-slate-800 text-sm">${m.name}</h4>
                            </div>
                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-phone text-[10px] mr-1"></i>${m.phone || 'नंबर नहीं'} | ${m.date || 'तारीख नहीं'}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">₹${totalAmt}</span>
                            <p class="text-[10px] text-slate-400 mt-1">${paidCount}/12 माह</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        let currentEditId = null;
        function openEdit(id) {
            // क्लिक साउंड बजाना
            let sound = document.getElementById('clickSound');
            sound.currentTime = 0;
            sound.play().catch(e => {});

            currentEditId = id;
            let m = members.find(x => x.id === id);
            document.getElementById('modalId').innerText = m.id;
            document.getElementById('modalName').innerText = m.name;
            document.getElementById('editPhone').value = m.phone || "";
            document.getElementById('editDate').value = m.date || "";
            document.getElementById('editMode').value = m.mode || "Cash (नकद)";

            let grid = document.getElementById('monthsGrid');
            grid.innerHTML = monthNames.map((mon, idx) => `
                <button type="button" onclick="toggleMonth(${idx})" class="p-2 text-xs rounded-xl border font-medium transition ${m.paid[idx] ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-slate-50 text-slate-500 border-slate-200'}">
                    ${mon} ${m.paid[idx] ? '✓' : ''}
                </button>
            `).join('');

            document.getElementById('editModal').classList.remove('hidden');
        }

        function toggleMonth(idx) {
            let m = members.find(x => x.id === currentEditId);
            m.paid[idx] = !m.paid[idx];
            openEdit(currentEditId);
        }

        function saveChanges() {
            let m = members.find(x => x.id === currentEditId);
            m.phone = document.getElementById('editPhone').value;
            m.date = document.getElementById('editDate').value;
            m.mode = document.getElementById('editMode').value;
            
            localStorage.setItem('nooriFund_v4', JSON.stringify(members));
            filterMembers();
            closeModal();
        }

        function filterMembers() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = members.filter(m => m.name.toLowerCase().includes(query) || m.id.toString().includes(query));
            renderList(filtered);
        }

        function closeModal() { document.getElementById('editModal').classList.add('hidden'); }

        // पहली बार लिस्ट लोड करें
        renderList(members);
    </script>
</body>
</html>
