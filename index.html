<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Village Portal - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        #otpSection {
            display: none;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
            color: green;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Digital Village Portal</h2>
        
        <!-- Phone Number Section -->
        <div id="phoneSection">
            <div class="input-group">
                <label for="phone">मोबाइल नंबर दर्ज करें</label>
                <input type="tel" id="phone" placeholder="9876543210" maxlength="10">
            </div>
            <button onclick="sendOTP()">OTP भेजें</button>
        </div>

        <!-- OTP Verification Section -->
        <div id="otpSection">
            <div class="input-group">
                <label for="otp">ओटीपी (OTP) दर्ज करें</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6">
            </div>
            <button onclick="verifyOTP()">लॉग इन करें</button>
        </div>

        <div class="message" id="msg"></div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbz13IV5Jpax4_B1w15dXXX826Q5eUK3KCcELKd5EkOuhZEYVBg12u9JgjDC_f6pc1Z3Cw/exec";
        let generatedOTP = "";

        function sendOTP() {
            const phone = document.getElementById("phone").value;
            const msg = document.getElementById("msg");

            if (phone.length !== 10) {
                alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!");
                return;
            }

            // 6 अंकों का रैंडम ओटीपी जनरेट करना
            generatedOTP = Math.floor(100000 + Math.random() * 900000);
            msg.style.color = "blue";
            msg.innerText = "ओटीपी भेजा जा रहा है...";

            // Google Apps Script को डेटा भेजना
            fetch(`${scriptURL}?phone=${phone}&otp=${generatedOTP}`)
                .then(response => response.json())
                .then(data => {
                    msg.style.color = "green";
                    msg.innerText = "OTP सफलतापूर्वक भेज दिया गया है! (डबग OTP: " + generatedOTP + ")";
                    document.getElementById("phoneSection").style.display = "none";
                    document.getElementById("otpSection").style.display = "block";
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    msg.style.color = "red";
                    msg.innerText = "कनेक्शन में समस्या आई, पुनः प्रयास करें।";
                });
        }

        function verifyOTP() {
            const userOTP = document.getElementById("otp").value;
            const msg = document.getElementById("msg");

            if (userOTP == generatedOTP) {
                msg.style.color = "green";
                msg.innerText = "लॉग इन सफल! पोर्टल पर रीडायरेक्ट हो रहे हैं...";
                setTimeout(() => {
                    alert("Welcome to Digital Village Portal!");
                    // यहाँ आप पोर्टल के होमपेज का लिंक या कोड जोड़ सकते हैं
                }, 1000);
            } else {
                msg.style.color = "red";
                msg.innerText = "गलत OTP! कृपया दोबारा चेक करें।";
            }
        }
    </script>

</body>
</html>
