<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>नूरी मस्जिद - एडमिन पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #splash { position: fixed; inset: 0; background: #064e3b; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Splash Screen -->
    <div id="splash"><h1 class="text-white text-3xl font-bold animate-pulse">नूरी मस्जिद एडमिन</h1></div>

    <div class="p-4 max-w-md mx-auto">
        <input type="text" id="search" placeholder="🔍 नाम या ID सर्च करें..." class="w-full p-3 rounded-xl border mb-4 shadow-sm" oninput="filterList()">
        <div id="memberList" class="space-y-2"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h2 id="mName" class="font-bold text-lg mb-4 text-emerald-800"></h2>
            <input type="text" id="ePhone" placeholder="Mobile" class="w-full border p-2 mb-2 rounded">
            <input type="date" id="eDate" class="w-full border p-2 mb-2 rounded">
            <select id="eMode" class="w-full border p-2 mb-4 rounded"><option>Cash</option><option>Online</option></select>
            <div id="monthsGrid" class="grid grid-cols-4 gap-1 mb-4"></div>
            <button onclick="save()" class="w-full bg-emerald-600 text-white p-2 rounded">सेव करें</button>
        </div>
    </div>

    <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script>
        // 3 सेकंड का Splash
        setTimeout(() => document.getElementById('splash').style.opacity = '0', 2000);
        setTimeout(() => document.getElementById('splash').style.display = 'none', 2500);

        let members = JSON.parse(localStorage.getItem('nooriDB')) || Array.from({length: 32}, (_, i) => ({id: 101+i, name: "Member "+(101+i), phone: "", date: "", paid: Array(12).fill(false)}));
        
        function render(data = members) {
            document.getElementById('memberList').innerHTML = data.map(m => `
                <div class="bg-white p-3 rounded-lg shadow flex justify-between items-center" onclick="playAndEdit(${m.id})">
                    <div><p class="font-bold">${m.name}</p><p class="text-xs text-gray-500">ID: ${m.id} | ${m.phone || 'No Phone'}</p></div>
                    <div class="text-right text-emerald-600 font-bold">₹${m.paid.filter(Boolean).length * 500}</div>
                </div>
            `).join('');
        }

        function playAndEdit(id) {
            document.getElementById('clickSound').play(); // Sound Effect
            let m = members.find(x => x.id === id);
            document.getElementById('mName').innerText = m.name;
            document.getElementById('ePhone').value = m.phone;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function filterList() {
            let val = document.getElementById('search').value.toLowerCase();
            render(members.filter(m => m.name.toLowerCase().includes(val) || m.id.toString().includes(val)));
        }

        function save() {
            // Save logic here...
            document.getElementById('editModal').classList.add('hidden');
        }
        
        render();
    </script>
</body>
</html>
